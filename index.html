<title>SANS Schedule Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dark control band on top, tab rail, single working column (max 1320px) of panels; tables & Gantt scroll inside their own frames. */
/* Light theme is deliberately low-glare: sage-tinted off-white ground, softened ink, quiet lines. Dark theme is near-black. */
:root {
  --bg: #f3f6f4; --surface: #fbfcfb; --sunk: #edf2ef; --ink: #2c3b40; --muted: #687a80; --line: #dde5e2;
  --band: #e6eeeb; --band-ink: #24393d; --band-muted: #5d7277; --band-line: #c5d3cf;
  --accent: #2f7672; --accent-ink: #ffffff; --accent-soft: #e1eeeb;
  --crit: #b0544b; --crit-soft: #f5e6e3; --warn: #9c6b22; --warn-soft: #f6eedf; --ok: #437d55; --ok-soft: #e3efe6;
  --bar: #6f9ea6; --bl: #cbd5d2; --done: #a2b4b3;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-head: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0d0e; --surface: #121718; --sunk: #0e1213; --ink: #e3eaeb; --muted: #94a4a8; --line: #252e31;
  --band: #000000; --band-ink: #e3eaeb; --band-muted: #889a9e; --band-line: #34403f;
  --accent: #5cbab5; --accent-ink: #04201f; --accent-soft: #15302f;
  --crit: #f07a6e; --crit-soft: #361c19; --warn: #e2ab52; --warn-soft: #33270f; --ok: #6ec686; --ok-soft: #162e1f;
  --bar: #5fa6b2; --bl: #3a4a50; --done: #54706f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a0d0e; --surface: #121718; --sunk: #0e1213; --ink: #e3eaeb; --muted: #94a4a8; --line: #252e31;
  --band: #000000; --band-ink: #e3eaeb; --band-muted: #889a9e; --band-line: #34403f;
  --accent: #5cbab5; --accent-ink: #04201f; --accent-soft: #15302f;
  --crit: #f07a6e; --crit-soft: #361c19; --warn: #e2ab52; --warn-soft: #33270f; --ok: #6ec686; --ok-soft: #162e1f;
  --bar: #5fa6b2; --bl: #3a4a50; --done: #54706f; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
h1, h2, h3, h4 { font-family: var(--f-head); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; }
.mono, td.num, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top band */
.band { background: var(--band); color: var(--band-ink); border-bottom: 1px solid var(--band-line); }
.band .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { font-family: var(--f-head); font-weight: 700; font-size: 1.05rem; letter-spacing: .14em; padding: 3px 8px; border: 1.5px solid var(--band-ink); border-radius: 3px; }
.brand-t { line-height: 1.15; }
.brand-t b { font-family: var(--f-head); font-size: 1.15rem; font-weight: 600; display: block; }
.brand-t span { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--band-muted); }
.band .sp { flex: 1; }
.switch { display: flex; align-items: center; gap: 8px; min-width: 0; }
.switch label { font-size: .75rem; color: var(--band-muted); text-transform: uppercase; letter-spacing: .08em; }
.switch select { background: transparent; color: var(--band-ink); border: 1px solid var(--band-line); border-radius: var(--r); padding: 6px 8px; max-width: 360px; min-width: 0; }
.switch select option { color: #14232a; background: #fff; }
.store { font-size: .75rem; color: var(--band-muted); display: flex; align-items: center; gap: 6px; }
.store i { width: 8px; height: 8px; border-radius: 50%; background: var(--band-muted); display: inline-block; }
.store.on i { background: var(--ok); }
.theme { display: inline-flex; border: 1px solid var(--band-line); border-radius: 20px; padding: 2px; gap: 2px; }
.theme button { border: 0; background: transparent; color: var(--band-muted); padding: 4px 12px; border-radius: 16px; cursor: pointer; font-size: .8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.theme button i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-block; }
.theme button[data-v="dark"] i { background: currentColor; }
.theme button[aria-pressed="true"] { background: var(--surface); color: var(--band-ink); box-shadow: 0 0 0 1px var(--band-line); }

/* tabs */
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 12px 14px 10px; text-decoration: none; color: var(--muted); font-family: var(--f-head); font-weight: 600; font-size: .98rem; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs a.off { opacity: .45; pointer-events: none; }
.tabs a small { font-family: var(--f-mono); font-size: .7rem; margin-left: 5px; padding: 0 5px; border-radius: 8px; background: var(--crit-soft); color: var(--crit); }

main.wrap { padding-block: 20px 60px; display: grid; gap: 18px; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.pbar .t { min-width: 0; flex: 1 1 280px; }
.pbar .t h2 { overflow-wrap: anywhere; }
.pbar .t .sub { color: var(--muted); font-size: .86rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel > header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.panel > header p { color: var(--muted); font-size: .88rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; }
.hint { color: var(--muted); font-size: .86rem; }
.eyebrow { font-family: var(--f-head); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: var(--r); cursor: pointer; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 4px 9px; font-size: .84rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 20px; font-size: .78rem; font-weight: 600; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.plain::before { display: none; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; align-content: start; border-top: 3px solid transparent; }
.kpi.crit { border-top-color: var(--crit); } .kpi.warn { border-top-color: var(--warn); } .kpi.ok { border-top-color: var(--ok); }
.kpi .l { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--f-head); font-weight: 600; }
.kpi .v { font-family: var(--f-mono); font-size: 1.32rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: .8rem; color: var(--muted); }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); max-width: 100%; }
.tw.tall { max-height: 560px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th { text-align: left; font-family: var(--f-head); font-weight: 600; font-size: .8rem; letter-spacing: .03em; color: var(--muted); background: var(--sunk); padding: 8px 10px; position: sticky; top: 0; z-index: 1; white-space: nowrap; border-bottom: 1px solid var(--line); }
td { padding: 8px 11px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
td.num, th.num { text-align: right; white-space: nowrap; }
td.date { font-family: var(--f-mono); font-size: .82rem; white-space: nowrap; }
td .idc { font-family: var(--f-mono); font-size: .82rem; font-weight: 500; }
.neg { color: var(--crit); font-weight: 600; }
.critrow > td:first-child { box-shadow: inset 3px 0 0 var(--crit); }
.nearrow > td:first-child { box-shadow: inset 3px 0 0 var(--warn); }

/* forms */
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px 16px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld > span { font-size: .78rem; color: var(--muted); font-weight: 500; }
.fld > span b { color: var(--crit); font-weight: 600; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 9px; min-width: 0; }
textarea { resize: vertical; min-height: 70px; font-family: var(--f-mono); font-size: .82rem; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.fs { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
.fs legend { font-family: var(--f-head); font-weight: 600; font-size: 1rem; padding: 0; margin-bottom: 6px; }
.check { display: flex; gap: 8px; align-items: center; }

.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 8px; justify-items: start; background: var(--sunk); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }

/* Gantt */
.gantt { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); max-height: 620px; background: var(--surface); }
.gantt svg { display: block; }
.gantt text { fill: var(--ink); font-family: var(--f-body); font-size: 11px; }
.gantt .lbl-id { font-family: var(--f-mono); fill: var(--muted); font-size: 10.5px; }
.gantt .tick { stroke: var(--line); } .gantt .tickt { fill: var(--muted); font-size: 10px; font-family: var(--f-mono); }
.gantt .zebra { fill: var(--sunk); }
.gantt .b-crit { fill: var(--crit); } .gantt .b-near { fill: var(--warn); } .gantt .b-norm { fill: var(--bar); } .gantt .b-done { fill: var(--done); }
.gantt .b-bl { fill: var(--bl); } .gantt .ghost { fill: none; stroke: var(--muted); stroke-dasharray: 3 2; }
.gantt .dd { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; } .gantt .cf { stroke: var(--crit); stroke-width: 1.5; }
.gantt .ddt { fill: var(--accent); font-weight: 600; font-size: 10px; } .gantt .cft { fill: var(--crit); font-weight: 600; font-size: 10px; }
.gantt .sep { stroke: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

/* lists */
.list { display: grid; gap: 0; }
.item { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.item:last-child { border-bottom: 0; }
.item .d { color: var(--muted); font-size: .86rem; overflow-wrap: anywhere; }
.ids { font-family: var(--f-mono); font-size: .78rem; color: var(--muted); overflow-wrap: anywhere; }
details > summary { cursor: pointer; color: var(--accent); font-size: .82rem; }

/* options */
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 14px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); background: var(--accent-soft); }
.opt .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); }
.opt[aria-checked="true"] .radio { border: 5px solid var(--accent); }
.opt .nm { font-weight: 600; } .opt .ds { color: var(--muted); font-size: .84rem; }
.opt .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .82rem; grid-column: 2 / 4; }
.opt .stats b { font-family: var(--f-mono); font-weight: 500; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.chart .nm { fill: var(--ink); font-family: var(--f-body); font-size: 11.5px; }
.chart .ax { stroke: var(--line); } .chart .tg { stroke: var(--crit); stroke-width: 1.5; } .chart .cur { stroke: var(--muted); stroke-dasharray: 3 3; }
.chart .stem { stroke: var(--accent); stroke-width: 2; } .chart .dot { fill: var(--accent); } .chart .dot.miss { fill: var(--warn); } .chart .dot0 { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }

/* heat map */
.heat { display: grid; grid-template-columns: 28px repeat(5, minmax(34px, 1fr)); gap: 3px; font-size: .78rem; max-width: 360px; }
.heat div { aspect-ratio: 1.4; display: grid; place-items: center; border-radius: 3px; font-family: var(--f-mono); }
.heat .ax { color: var(--muted); aspect-ratio: auto; }
.h-l { background: var(--ok-soft); color: var(--ok); } .h-m { background: var(--warn-soft); color: var(--warn); } .h-h { background: var(--crit-soft); color: var(--crit); }
.heat .has { font-weight: 700; outline: 2px solid currentColor; outline-offset: -2px; }

/* report */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(16px, 4vw, 40px); max-width: 980px; display: grid; gap: 6px; }
.report .rh { border-bottom: 3px solid var(--accent); padding-bottom: 12px; margin-bottom: 8px; }
.report .org { font-family: var(--f-head); letter-spacing: .12em; text-transform: uppercase; font-size: .74rem; color: var(--muted); }
.report h1 { font-size: 1.7rem; }
.report .meta { color: var(--muted); font-size: .88rem; }
.report h2 { font-size: 1.1rem; color: var(--accent); margin: 18px 0 6px; }
.report p { max-width: 75ch; margin: 6px 0; }
.report .small { font-size: .82rem; color: var(--muted); }
.report table { font-size: .82rem; }
.report .tw { margin: 6px 0; }

.empty { padding: 28px; text-align: left; display: grid; gap: 10px; justify-items: start; border: 1.5px dashed var(--line); border-radius: var(--r); }
.notice { padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-size: .88rem; }
.notice.info { background: var(--accent-soft); color: var(--accent); }

/* overlay editor */
.ov { position: fixed; inset: 0; background: rgb(0 0 0 / .42); z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ov .box { background: var(--surface); border-radius: var(--r); padding: 20px; width: min(760px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 14px; border: 1px solid var(--line); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); z-index: 30; font-size: .9rem; max-width: calc(100% - 32px); }
.prog { height: 10px; background: var(--sunk); border-radius: 5px; position: relative; overflow: hidden; }
.prog i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
.prog .p { background: var(--bl); } .prog .a { background: var(--accent); height: 50%; top: 25%; }
@media (max-width: 640px) { .opt .stats { grid-column: 1 / -1; } .kpi .v { font-size: 1.1rem; } }
@media (prefers-reduced-motion: no-preference) { .btn, .opt, .tabs a { transition: border-color .15s, background-color .15s, color .15s; } }
</style>
